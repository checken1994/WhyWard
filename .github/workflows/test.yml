name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run governed demo
        shell: bash
        run: PYTHONPATH=src python -m whyward.cli demo --catalog examples/catalog
